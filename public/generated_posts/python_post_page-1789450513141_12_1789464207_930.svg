<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
    <linearGradient id="vignette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050811" stop-opacity="0.82"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#020408" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- High-Res Niche Base Image Pulled by Python Engine -->
  <image href="https://images.pexels.com/photos/596132/pexels-photo-596132.jpeg?auto=compress&amp;cs=tinysrgb&amp;dpr=2&amp;h=650&amp;w=940" x="0" y="0" width="1080" height="1080" preserveAspectRatio="xMidYMid slice"/>

  <!-- Chiaroscuro Contrast Grading Layer -->
  <rect x="0" y="0" width="1080" height="1080" fill="url(#vignette)"/>

  <!-- Atmospheric Border Accent -->
  <rect x="24" y="24" width="1032" height="1032" fill="none" stroke="#38BDF8" stroke-opacity="0.40" stroke-width="1.5" rx="8"/>

  <!-- Top Category Tag -->
  <g transform="translate(540, 110)">
    <rect x="-105" y="-18" width="210" height="36" rx="6" fill="#38BDF8" fill-opacity="0.95"/>
    <text x="0" y="5" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="900" fill="#0A0A0A" letter-spacing="2">ATHEISM</text>
  </g>

  <!-- Quote Typography -->
  <g>
    <text x="540" y="426" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#FFFFFF" letter-spacing="-0.3" filter="url(#drop-shadow)">I would never die for my</text><text x="540" y="482" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#FFFFFF" letter-spacing="-0.3" filter="url(#drop-shadow)">beliefs because I might be</text><text x="540" y="538" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#FFFFFF" letter-spacing="-0.3" filter="url(#drop-shadow)">wrong.</text>
  </g>

  <!-- Gold/Accent Divider Line -->
  <line x1="430" y1="619" x2="650" y2="619" stroke="url(#accent-grad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Author Attribution -->
  <text x="540" y="669" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#7DD3FC" letter-spacing="1.5">BERTRAND RUSSELL</text>

  <!-- Footer Brand Handle & Engine Citation -->
  <g transform="translate(540, 990)">
    <text x="0" y="0" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#94A3B8" letter-spacing="1.5">Angelia</text>
    <text x="0" y="24" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="500" fill="#64748B" letter-spacing="1">ARCHIVE: Pexels API (Bruno Scramgnon) • ZERO REPETITION GUARANTEED</text>
  </g>
</svg>