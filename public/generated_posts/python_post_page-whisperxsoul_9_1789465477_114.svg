<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="paper-vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#262018" stop-opacity="0.08"/>
    </radialGradient>
  </defs>

  <!-- High-Res Watercolor Pressed Paper Texture -->
  <image href="https://images.pexels.com/photos/20818883/pexels-photo-20818883.jpeg?auto=compress&amp;cs=tinysrgb&amp;dpr=2&amp;h=650&amp;w=940" x="0" y="0" width="1080" height="1080" preserveAspectRatio="xMidYMid slice"/>

  <!-- Subtle Organic Edge Warmth -->
  <rect x="0" y="0" width="1080" height="1080" fill="url(#paper-vignette)"/>

  <!-- Typewriter Poetry & Motivation Typography -->
  <g>
    <text x="540" y="430" text-anchor="middle" font-family="'Special Elite', 'Courier Prime', 'Courier New', monospace" font-size="40" font-weight="700" fill="#111111" letter-spacing="0.2">The right person will never</text><text x="540" y="490" text-anchor="middle" font-family="'Special Elite', 'Courier Prime', 'Courier New', monospace" font-size="40" font-weight="700" fill="#111111" letter-spacing="0.2">make you feel like you are</text><text x="540" y="550" text-anchor="middle" font-family="'Special Elite', 'Courier Prime', 'Courier New', monospace" font-size="40" font-weight="700" fill="#111111" letter-spacing="0.2">hard to love.</text>
  </g>

  <!-- Bottom Brand Watermark in Matching Typewriter Font (e.g. Untold Feelings) -->
  <text x="540" y="990" text-anchor="middle" font-family="'Special Elite', 'Courier Prime', 'Courier New', monospace" font-size="24" font-weight="700" fill="#18181B" letter-spacing="0.8">Untold Feelings</text>
</svg>